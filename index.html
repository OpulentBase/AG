<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #13100B; }
  body {
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    color: #F2EDE4;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .veil {
    position: fixed; inset: 0; z-index: 40;
    background: #13100B;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease;
  }
  .veil.gone { opacity: 0; pointer-events: none; }
  .veil p {
    font-size: 13px; letter-spacing: 0.42em; text-indent: 0.42em;
    color: rgba(240,226,196,0.5);
  }

  .mark {
    position: fixed; top: 26px; left: 0; right: 0; z-index: 20;
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.6s ease 0.5s;
  }
  .mark.in { opacity: 1; }
  .mark span {
    display: block; font-size: 17px; font-weight: 400;
    letter-spacing: 0.36em; text-indent: 0.36em;
    color: rgba(246,235,212,0.92);
  }
  .mark small {
    display: block; margin-top: 7px; font-size: 9px;
    letter-spacing: 0.46em; text-indent: 0.46em;
    color: rgba(240,226,196,0.4);
    font-family: system-ui, sans-serif;
  }

  .hint {
    position: fixed; bottom: 34px; left: 0; right: 0; z-index: 20;
    text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: 0.3em; text-indent: 0.3em;
    color: rgba(240,226,196,0.42);
    font-family: system-ui, sans-serif;
    opacity: 0; transition: opacity 1.4s ease;
  }
  .hint.in { opacity: 1; }

  .prompt {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,7,6,0.72);
    opacity: 0; pointer-events: none;
    transition: opacity 0.55s ease;
  }
  .prompt.open { opacity: 1; pointer-events: auto; }
  .card {
    width: min(88vw, 420px);
    padding: 44px 34px 34px;
    text-align: center;
    border: 1px solid rgba(201,162,39,0.42);
    background: rgba(10,9,8,0.92);
    transform: translateY(14px);
    transition: transform 0.55s cubic-bezier(0.2,0.8,0.25,1);
  }
  .prompt.open .card { transform: translateY(0); }
  .card h2 {
    font-size: 27px; font-weight: 300;
    letter-spacing: 0.14em; text-indent: 0.14em;
    margin-bottom: 14px;
  }
  .card p {
    font-size: 12px; line-height: 1.9; letter-spacing: 0.16em;
    color: rgba(242,237,228,0.5);
    font-family: system-ui, sans-serif;
    margin-bottom: 32px;
  }
  .card button {
    display: block; width: 100%; padding: 15px;
    font-family: system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.28em; text-indent: 0.28em;
    cursor: pointer; border-radius: 0; transition: all 0.35s ease;
  }
  .go {
    color: #0a0908; background: #C9A227;
    border: 1px solid #C9A227; margin-bottom: 12px;
  }
  .go:hover { background: #DDB93C; border-color: #DDB93C; }
  .no {
    color: rgba(242,237,228,0.5); background: transparent;
    border: 1px solid rgba(242,237,228,0.18);
  }
  .no:hover { color: #F2EDE4; border-color: rgba(242,237,228,0.4); }
  button:focus-visible { outline: 2px solid #C9A227; outline-offset: 3px; }

  .fade {
    position: fixed; inset: 0; z-index: 35; background: #13100B;
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
  }
  .fade.on { opacity: 1; }
  .inside {
    position: fixed; inset: 0; z-index: 36;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; text-align: center; padding: 30px;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease 0.6s;
  }
  .inside.on { opacity: 1; }
  .inside h3 {
    font-size: 22px; font-weight: 300;
    letter-spacing: 0.2em; text-indent: 0.2em;
  }
  .inside p {
    font-size: 11px; letter-spacing: 0.22em; line-height: 2.2;
    color: rgba(242,237,228,0.42);
    font-family: system-ui, sans-serif;
    max-width: 320px;
  }
  .mute {
    position: fixed; z-index: 25;
    top: calc(22px + env(safe-area-inset-top)); right: 22px;
    width: 40px; height: 40px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(240,226,196,0.75);
    background: rgba(19,16,11,0.4);
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 50%;
    cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease, color 0.25s ease, border-color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mute.shown { opacity: 1; pointer-events: auto; }
  .mute:hover { color: #F6EBD4; border-color: rgba(201,162,39,0.7); }
  .mute svg { width: 17px; height: 17px; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: block; }

  .tag {
    position: fixed; z-index: 22; left: 50%; bottom: 88px;
    transform: translateX(-50%);
    padding: 7px 16px;
    font-size: 11px; letter-spacing: 0.24em; text-indent: 0.24em;
    text-transform: uppercase;
    font-family: system-ui, sans-serif;
    color: #F6EBD4;
    background: rgba(19,16,11,0.72);
    border: 1px solid rgba(201,162,39,0.4);
    pointer-events: none; opacity: 0;
    transition: opacity 0.25s ease;
  }
  .tag.shown { opacity: 1; }

  .back {
    position: fixed; z-index: 25;
    bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%);
    padding: 12px 26px;
    font-family: system-ui, sans-serif;
    font-size: 10px; letter-spacing: 0.3em; text-indent: 0.3em;
    text-transform: uppercase;
    color: rgba(240,226,196,0.72);
    background: rgba(19,16,11,0.5);
    border: 1px solid rgba(201,162,39,0.34);
    border-radius: 0; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease, color 0.25s ease, border-color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .back.shown { opacity: 1; pointer-events: auto; }
  .back:hover { color: #F6EBD4; border-color: rgba(201,162,39,0.75); }

  .card {
    position: fixed; z-index: 28;
    left: 50%; bottom: 96px; transform: translate(-50%, 18px);
    width: min(86vw, 340px);
    padding: 30px 26px 26px; text-align: center;
    background: rgba(16,13,9,0.94);
    border: 1px solid rgba(201,162,39,0.42);
    opacity: 0; pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2,0.8,0.25,1);
  }
  .card.shown { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .card__eyebrow {
    font-size: 9px; letter-spacing: 0.4em; text-indent: 0.4em;
    text-transform: uppercase; color: rgba(201,162,39,0.85);
    font-family: system-ui, sans-serif; margin-bottom: 12px;
  }
  .card h3 {
    font-size: 23px; font-weight: 300;
    letter-spacing: 0.1em; text-indent: 0.1em; margin-bottom: 14px;
  }
  .card__note {
    font-size: 10px; letter-spacing: 0.18em; line-height: 2;
    color: rgba(240,226,196,0.42); font-family: system-ui, sans-serif;
  }
  .card__x {
    position: absolute; top: 8px; right: 10px;
    width: 30px; height: 30px; padding: 0;
    font-size: 20px; line-height: 1;
    color: rgba(240,226,196,0.5);
    background: none; border: none; cursor: pointer;
  }
  .card__x:hover { color: #F6EBD4; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>

<div id="stage"></div>

<div class="mark" id="mark">
  <span>ALFREDO GUERRERO</span>
  <small>GUADALAJARA</small>
</div>

<div class="hint" id="hint">Drag to look around &nbsp;·&nbsp; Tap the door to enter</div>

<div class="prompt" id="prompt" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="card">
    <h2 id="ptitle">Enter the boutique</h2>
    <p>Avenida Chapultepec, Guadalajara.<br>The doors are open.</p>
    <button class="go" id="go">Step inside</button>
    <button class="no" id="no">Stay on the street</button>
  </div>
</div>

<button class="mute" id="mute" aria-label="Mute music" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</button>

<div class="tag" id="tag"></div>

<button class="back" id="back">Step outside</button>

<div class="card" id="card">
  <button class="card__x" id="cardclose" aria-label="Close">&times;</button>
  <p class="card__eyebrow">Alfredo Guerrero</p>
  <h3 id="cardname">Piece</h3>
  <p class="card__note">Variants, sizes and add to cart wire in next.</p>
</div>

<div class="veil" id="veil"><p>GUADALAJARA</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var STONE = 0xC2A278, STONE_L = 0xD8BE96, STONE_D = 0x8C7047;
  var LACQUER = 0x14100B, BRASS = 0xC9A227, IVORY = 0xEFE3CB;
  var GLOW = 0xFFC978, SODIUM = 0xFFB863, FOLIAGE = 0x4E5033;
  var DUSK = 0x14100B, BURGUNDY = 0x5A1F22;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(DUSK);
  scene.fog = new THREE.FogExp2(0x1A1309, 0.0108);

  var camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.96;
  document.getElementById('stage').appendChild(renderer.domElement);

  var world = new THREE.Group();
  scene.add(world);

  function mat(c, r, m) {
    return new THREE.MeshStandardMaterial({
      color: c, roughness: r === undefined ? 0.92 : r, metalness: m === undefined ? 0.02 : m });
  }
  function lit(c, s) {
    return new THREE.MeshStandardMaterial({
      color: c, emissive: c, emissiveIntensity: s, roughness: 0.85 });
  }
  function box(w, h, d, m, x, y, z) {
    var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z);
    b.castShadow = true; b.receiveShadow = true;
    return b;
  }

  var rustic = (function () {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = '#C2A278'; g.fillRect(0, 0, 256, 256);
    var rows = 4, rh = 64, seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var r = 0; r < rows; r++) {
      var off = (r % 2) * 64, y = r * rh;
      for (var q = -1; q < 3; q++) {
        var x = q * 128 + off, v = 0.92 + rnd() * 0.16;
        g.fillStyle = 'rgb(' + Math.round(194 * v) + ',' + Math.round(162 * v) + ',' + Math.round(120 * v) + ')';
        g.fillRect(x + 3, y + 3, 122, rh - 6);
        g.fillStyle = 'rgba(255,236,201,0.20)'; g.fillRect(x + 3, y + 3, 122, 3);
        g.fillStyle = 'rgba(58,40,20,0.32)'; g.fillRect(x + 3, y + rh - 6, 122, 3);
      }
      g.fillStyle = 'rgba(58,40,20,0.38)'; g.fillRect(0, y + rh - 3, 256, 3);
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding;
    return t;
  })();
  function stoneMat(scale) {
    var t = rustic.clone(); t.needsUpdate = true; t.repeat.set(scale, scale);
    return new THREE.MeshStandardMaterial({ map: t, color: 0xFFFFFF, roughness: 0.94 });
  }

  /* herringbone parquet */
  var parquet = (function () {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = '#5A3C21'; g.fillRect(0, 0, 256, 256);
    var seed = 3;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var r = -1; r < 8; r++) {
      for (var q = -1; q < 8; q++) {
        var bx = q * 36, by = r * 36;
        for (var k = 0; k < 2; k++) {
          g.save();
          g.translate(bx + k * 18, by + k * 18);
          g.rotate(k === 0 ? Math.PI / 4 : -Math.PI / 4);
          var v = 0.85 + rnd() * 0.3;
          g.fillStyle = 'rgb(' + Math.round(126 * v) + ',' + Math.round(86 * v) + ',' + Math.round(46 * v) + ')';
          g.fillRect(0, 0, 34, 13);
          g.fillStyle = 'rgba(30,18,8,0.5)';
          g.fillRect(0, 12, 34, 2);
          g.restore();
        }
      }
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(3, 4);
    t.encoding = THREE.sRGBEncoding;
    return t;
  })();

  /* pale marble */
  var marble = (function () {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = '#EDE4D2'; g.fillRect(0, 0, 256, 256);
    var seed = 11;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 16; i++) {
      g.strokeStyle = 'rgba(120,104,80,' + (0.08 + rnd() * 0.14).toFixed(2) + ')';
      g.lineWidth = 1 + rnd() * 2.5;
      g.beginPath();
      var x = rnd() * 256, y = rnd() * 256;
      g.moveTo(x, y);
      g.quadraticCurveTo(x + rnd() * 120 - 60, y + rnd() * 120 - 60, x + rnd() * 200 - 100, y + rnd() * 200 - 100);
      g.stroke();
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding;
    return t;
  })();

  /* ---------------- plinth + street ---------------- */
  var plinth = new THREE.Mesh(new THREE.CylinderGeometry(20, 20.6, 1.0, 80), mat(0x140F09, 0.96));
  plinth.position.y = -0.5; plinth.receiveShadow = true; world.add(plinth);
  var road = new THREE.Mesh(new THREE.CircleGeometry(20, 80), mat(0x1C150E, 0.98));
  road.rotation.x = -Math.PI / 2; road.position.y = 0.002; road.receiveShadow = true; world.add(road);
  world.add(box(44, 0.24, 3.8, mat(0x6B5738, 0.95), 0, 0.12, 3.3));
  world.add(box(44, 0.14, 0.34, mat(0x4A3B25, 0.94), 0, 0.19, 5.2));

  /* ---------------- boutique shell ---------------- */
  var shop = new THREE.Group();
  world.add(shop);

  var BW = 11.0, BH = 7.6, BD = 17.0;
  var FZ = 2.70, WALL_T = 0.35, BACK_Z = FZ - BD;
  var IN_W = BW - 2 * WALL_T, FLOOR_Y = 0.5, CEIL_Y = 6.6;
  var MIDZ = FZ - BD / 2;

  var SIDE_D = BD + 0.5, SIDE_Z = (FZ - WALL_T - 0.04) - SIDE_D / 2;
  shop.add(box(WALL_T, BH, SIDE_D, mat(STONE_D, 0.93), -(BW / 2 - WALL_T / 2), BH / 2, SIDE_Z));
  shop.add(box(WALL_T, BH, SIDE_D, mat(STONE_D, 0.93), BW / 2 - WALL_T / 2, BH / 2, SIDE_Z));
  shop.add(box(BW, BH, WALL_T, mat(STONE_D, 0.93), 0, BH / 2, BACK_Z + WALL_T / 2));
  shop.add(box(BW, 0.3, SIDE_D - 0.7, mat(0x1D1610, 0.9), 0, BH - 0.2, SIDE_Z + 0.16));

  var WIN_Y0 = 0.95, WIN_Y1 = 4.35;
  var DOOR_W = 2.8, DOOR_BASE = 0.45, DOOR_STRAIGHT = 2.80;
  var DOOR_R = DOOR_W / 2, DOOR_TOP = DOOR_BASE + DOOR_STRAIGHT + DOOR_R;
  var WIN_L0 = -4.62, WIN_L1 = -2.25, WIN_R0 = 2.25, WIN_R1 = 4.62;

  function rectHole(x0, y0, x1, y1) {
    var p = new THREE.Path();
    p.moveTo(x0, y0); p.lineTo(x0, y1); p.lineTo(x1, y1); p.lineTo(x1, y0); p.lineTo(x0, y0);
    return p;
  }
  function archPath(Ctor, w, base, straight) {
    var p = new Ctor(), r = w / 2;
    p.moveTo(-r, base); p.lineTo(-r, base + straight);
    p.absarc(0, base + straight, r, Math.PI, 0, true);
    p.lineTo(r, base); p.lineTo(-r, base);
    return p;
  }

  var facade = new THREE.Shape();
  facade.moveTo(-BW / 2, 0); facade.lineTo(BW / 2, 0);
  facade.lineTo(BW / 2, BH); facade.lineTo(-BW / 2, BH); facade.lineTo(-BW / 2, 0);
  facade.holes.push(rectHole(WIN_L0, WIN_Y0, WIN_L1, WIN_Y1));
  facade.holes.push(rectHole(WIN_R0, WIN_Y0, WIN_R1, WIN_Y1));
  facade.holes.push(archPath(THREE.Path, DOOR_W, DOOR_BASE, DOOR_STRAIGHT));

  var frontWall = new THREE.Mesh(
    new THREE.ExtrudeGeometry(facade, { depth: WALL_T, bevelEnabled: false, curveSegments: 32 }),
    stoneMat(0.22));
  frontWall.position.set(0, 0, FZ - WALL_T);
  frontWall.castShadow = true; frontWall.receiveShadow = true;
  shop.add(frontWall);

  /* bands and cornices — depths staggered so no two faces share a plane */
  shop.add(box(BW + 0.35, 0.55, BD + 0.35, mat(STONE_D, 0.92), 0, 0.27, MIDZ));
  shop.add(box(BW + 0.18, 0.34, BD + 0.18, mat(STONE_L, 0.9), 0, 4.95, MIDZ));
  shop.add(box(BW + 0.62, 0.5, BD + 0.62, mat(STONE_L, 0.88), 0, 7.42, MIDZ));

  /* quoins sunk into the wall so their backs are never coplanar with it */
  [-(BW / 2 - 0.26), BW / 2 - 0.26].forEach(function (x) {
    for (var k = 0; k < 6; k++) {
      var wq = k % 2 === 0 ? 0.58 : 0.42;
      shop.add(box(wq, 0.86, 0.32, mat(k % 2 === 0 ? STONE_L : STONE, 0.9), x, 0.98 + k * 0.92, FZ + 0.06));
    }
  });

  var keystone = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.5, 0.95, 4), mat(STONE_L, 0.88));
  keystone.rotation.y = Math.PI / 4;
  keystone.position.set(0, DOOR_TOP + 0.18, FZ + 0.14);
  keystone.castShadow = true;
  shop.add(keystone);

  var glassMat = new THREE.MeshStandardMaterial({
    color: 0xFFD79A, emissive: GLOW, emissiveIntensity: 0.42,
    roughness: 0.2, metalness: 0.08, transparent: true, opacity: 0.26, side: THREE.DoubleSide });
  [[WIN_L0, WIN_L1], [WIN_R0, WIN_R1]].forEach(function (w) {
    var pane = new THREE.Mesh(
      new THREE.PlaneGeometry(w[1] - w[0] - 0.02, WIN_Y1 - WIN_Y0 - 0.02), glassMat);
    pane.position.set((w[0] + w[1]) / 2, (WIN_Y0 + WIN_Y1) / 2, FZ - WALL_T / 2);
    shop.add(pane);
  });

  var doorGlass = new THREE.Mesh(
    new THREE.ShapeGeometry(archPath(THREE.Shape, DOOR_W - 0.06, DOOR_BASE + 0.03, DOOR_STRAIGHT - 0.03), 32),
    new THREE.MeshStandardMaterial({
      color: 0xFFDCA4, emissive: GLOW, emissiveIntensity: 1.15,
      roughness: 0.28, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
  doorGlass.position.set(0, 0, FZ - WALL_T / 2);
  shop.add(doorGlass);
  var doorGlassMat = doorGlass.material;

  var lacquer = mat(LACQUER, 0.32, 0.28);
  var iron = mat(0x0E0B07, 0.45, 0.55);
  var brassMat = mat(BRASS, 0.28, 0.92);

  function surround(x0, y0, x1, y1, t) {
    var o = new THREE.Shape();
    o.moveTo(x0 - t, y0 - t); o.lineTo(x1 + t, y0 - t);
    o.lineTo(x1 + t, y1 + t); o.lineTo(x0 - t, y1 + t); o.lineTo(x0 - t, y0 - t);
    o.holes.push(rectHole(x0, y0, x1, y1));
    var m = new THREE.Mesh(new THREE.ExtrudeGeometry(o, { depth: 0.22, bevelEnabled: false }), lacquer);
    m.position.set(0, 0, FZ + 0.05);
    m.castShadow = true;
    shop.add(m);
    for (var c = 1; c < 2; c++)

    function rnd() { n = (n * 9301 + 49297) % 233280; return n / 233280; }

      for (var q = 0; q < cols; q++) {
        if (rnd() > density) continue;
        g.fillStyle = rnd() > 0.45 ? '#FFCA7A' : '#E0A455';
        g.fillRect(q * cw + cw * 0.28, r * rh + rh * 0.3, cw * 0.44, rh * 0.34);

  function makeStars(count, size, rMin, rMax, elMin, elMax, tint, twLo, twHi) {
    var pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    var phase = new Float32Array(count), speed = new Float32Array(count), base = new Float32Array(count);
    var c = new THREE.Color(tint);
    for (var i = 0; i < count; i++) {
      var az = (Math.random() - 0.5) * Math.PI * 1.15;
      var elv = elMin + Math.random() * (elMax - elMin);
      var R = rMin + Math.random() * (rMax - rMin);
      pos[i * 3] = Math.sin(az) * Math.cos(elv) * R;
      pos[i * 3 + 1] = Math.sin(elv) * R;
      pos[i * 3 + 2] = -Math.abs(Math.cos(az) * Math.cos(elv)) * R;
      phase[i] = Math.random() * Math.PI * 2;
      speed[i] = twLo + Math.random() * (twHi - twLo);
      base[i] = 0.55 + Math.random() * 0.45;
      col[i * 3] = c.r * base[i]; col[i * 3 + 1] = c.g * base[i]; col[i * 3 + 2] = c.b * base[i];

          attr.array[j * 3 + 1] = c.g * k;

    if (m !== 'inside') return STREET_FOV;
    var aspect = innerWidth / innerHeight;
    var v = 2 * Math.atan(Math.tan(26 * Math.PI / 180) / aspect) * 180 / Math.PI;
    return Math.max(42, Math.min(72, v));
  }
  var fovTarget = STREET_FOV;
  var R_IDEAL = idealRadius();
  var R_MIN = Math.max(14, R_IDEAL * 0.42);
  var R_MAX = R_IDEAL * 1.5;
  var R_START = R_IDEAL;
  var userZoomed = false, enterFrom = R_START;
  var tgt = new THREE.Vector3(0, 4.7, 0);
  var sph = { r: R_START, theta: -0.13, phi: 1.60 };
  var goal = { r: R_START, theta: -0.13, phi: 1.60 };
  var autoSpin = true, idle = 0, sway = 0;

  /* inside-the-salon camera: fixed stance, look around */
  var mode = 'street';
  var IN_POS = new THREE.Vector3(0, 2.55, FZ - 1.6);
  var IN_LOOK = new THREE.Vector3(0, 2.4, FZ - 12);
  var IN_TH = 1.05, IN_PH_MIN = 1.24, IN_PH_MAX = 1.92;
  var IN_Z_NEAR = FZ - 1.2, IN_Z_FAR = FZ - 12.0, advance = 0.12;
  var startPos = new THREE.Vector3(), startLook = new THREE.Vector3();
  var doorGate = new THREE.Vector3(0, 2.1, FZ + 0.1);
  var reverse = false;

  function place() {
    if (mode === 'inside') {
      IN_POS.z = IN_Z_NEAR + (IN_Z_FAR - IN_Z_NEAR) * advance;
      camera.position.copy(IN_POS);
      camera.lookAt(
        IN_POS.x + Math.sin(sph.phi) * Math.sin(sph.theta) * 10,
        IN_POS.y + Math.cos(sph.phi) * 10,
        IN_POS.z - Math.sin(sph.phi) * Math.cos(sph.theta) * 10
      );
      return;
    }
    camera.position.set(
      tgt.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
      tgt.y + sph.r * Math.cos(sph.phi),
      tgt.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
    );
    camera.lookAt(tgt);
  }
  function limits() {
    return mode === 'inside'
      ? { th: IN_TH, p0: IN_PH_MIN, p1: IN_PH_MAX }
      : { th: TH_MAX, p0: PH_MIN, p1: PH_MAX };
  }

  var dragging = false, moved = 0, lastX = 0, lastY = 0, pinch = 0;
  var el = renderer.domElement;
  var ray = new THREE.Raycaster();
  var pointer = new THREE.Vector2(999, 999);
  var hot = false, entering = false, walkIn = 0;

  var live = 0, multi = false, downX = 0, downY = 0, drift = 0;
  var touchOnly = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);

  function toNDC(e) {
    var r = el.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }
  function overDoor() {
    ray.setFromCamera(pointer, camera);
    return ray.intersectObject(hit).length > 0;
  }

  el.addEventListener('pointerdown', function (e) {
    live++;
    if (live > 1) { multi = true; dragging = false; return; }
    multi = false;
    dragging = true;
    downX = e.clientX; downY = e.clientY; drift = 0;
    lastX = e.clientX; lastY = e.clientY;
    toNDC(e);
    autoSpin = false; idle = 0;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });

  el.addEventListener('pointermove', function (e) {
    if (!touchOnly || dragging) toNDC(e);
    if (!dragging || multi) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    var d = Math.sqrt((e.clientX - downX) * (e.clientX - downX) +
                      (e.clientY - downY) * (e.clientY - downY));
    if (d > drift) drift = d;
    var L = limits();
    var kx = mode === 'inside' ? 0.0030 : -0.0050;
    goal.theta = Math.min(L.th, Math.max(-L.th, goal.theta + dx * kx));
    goal.phi = Math.min(L.p1, Math.max(L.p0, goal.phi - dy * 0.0038));
  });

  function endPointer(e) {
    live = Math.max(0, live - 1);
    var wasDrag = dragging, wasMulti = multi;
    dragging = false;
    idle = 0;
    if (live === 0) multi = false;
    if (!wasDrag || wasMulti || entering) return;

    var isTouch = e.pointerType === 'touch' || e.pointerType === 'pen';
    var slop = isTouch ? 18 : 8;
    if (drift <= slop) {
      toNDC(e);
      if (mode === 'street') { if (overDoor()) { enterStore(); return; } }
      else { var p = overProduct(); if (p) { showProduct(p); return; } }
    }
    if (isTouch) { pointer.set(999, 999); hot = false; }
  }
  el.addEventListener('pointerup', endPointer);
  el.addEventListener('pointercancel', function () {
    live = Math.max(0, live - 1);
    dragging = false;
    if (live === 0) multi = false;
  });
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (mode === 'inside') { advance = Math.min(1, Math.max(0, advance + e.deltaY * 0.0011)); return; }
    goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r + e.deltaY * 0.022));
    userZoomed = true; autoSpin = false; idle = 0;
  }, { passive: false });
  el.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  el.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinch) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
      if (mode === 'inside') { advance = Math.min(1, Math.max(0, advance - (d - pinch) * 0.004)); pinch = d; return; }
      goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r - (d - pinch) * 0.06));
      pinch = d; userZoomed = true; autoSpin = false; idle = 0;
    }
  }, { passive: true });
  el.addEventListener('touchend', function () { pinch = 0; });

  /* ---------------- enter ---------------- */
  var hotProduct = null;
  var tagEl = document.getElementById('tag');
  var backEl = document.getElementById('back');
  var cardEl = document.getElementById('card');
  var cardName = document.getElementById('cardname');

  function setLift(h, on) {
    var m = h.userData.mesh;
    if (!m) return;
    m.userData.lift = on;
  }
  function overProduct() {
    ray.setFromCamera(pointer, camera);
    var pk = ray.intersectObjects(products);
    return pk.length ? pk[0].object : null;
  }
  function showProduct(h) {
    if (!cardEl) return;
    if (cardName) cardName.textContent = h.userData.name;
    cardEl.classList.add('shown');
  }
  if (cardEl) {
    var cl = document.getElementById('cardclose');
    if (cl) cl.addEventListener('click', function (ev) {
      ev.stopPropagation(); cardEl.classList.remove('shown');
    });
  }
  if (backEl) backEl.addEventListener('click', function (ev) {
    ev.stopPropagation(); exitStore();
  });

  function exitStore() {
    if (entering) return;
    reverse = true; entering = true; walkIn = 0;
    startPos.copy(camera.position);
    startLook.copy(IN_LOOK);
    if (cardEl) cardEl.classList.remove('shown');
    if (tagEl) tagEl.classList.remove('shown');
    if (backEl) backEl.classList.remove('shown');
    document.getElementById('hint').classList.remove('in');
  }

  function enterStore() {
    if (entering) return;
    entering = true;
    reverse = false;
    walkIn = 0;
    enterFrom = sph.r;
    startPos.copy(camera.position);
    startLook.copy(tgt);
    startMusic();
    autoSpin = false;
    document.getElementById('mark').classList.remove('in');
    document.getElementById('hint').classList.remove('in');
    el.style.cursor = 'default';
  }

  /* ---------------- loop ---------------- */
  function streetRest() {
    return new THREE.Vector3(
      R_IDEAL * Math.sin(1.60) * Math.sin(-0.13),
      4.7 + R_IDEAL * Math.cos(1.60),
      R_IDEAL * Math.sin(1.60) * Math.cos(-0.13)
    );
  }
  for (var qi = 0; qi < products.length; qi++) {
    var qm = products[qi].userData.mesh;
    if (qm) qm.userData.baseY = qm.position.y;
  }
  var clock = new THREE.Clock();
  function renderStars(dt) {
    for (var s = 0; s < starLayers.length; s++) starLayers[s].update(clock.elapsedTime);
  }
  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);

    if (entering) {
      walkIn = Math.min(1, walkIn + dt * (reverse ? 0.42 : 0.34));
      var e2 = walkIn * walkIn * (3 - 2 * walkIn);
      var A = reverse ? IN_POS : startPos;
      var B = reverse ? streetRest() : IN_POS;
      var u = 1 - e2;
      camera.position.set(
        u * u * A.x + 2 * u * e2 * doorGate.x + e2 * e2 * B.x,
        u * u * A.y + 2 * u * e2 * doorGate.y + e2 * e2 * B.y,
        u * u * A.z + 2 * u * e2 * doorGate.z + e2 * e2 * B.z
      );
      var LA = reverse ? IN_LOOK : startLook;
      var LB = reverse ? new THREE.Vector3(0, 4.7, 0) : IN_LOOK;
      camera.lookAt(
        LA.x + (LB.x - LA.x) * e2,
        LA.y + (LB.y - LA.y) * e2,
        LA.z + (LB.z - LA.z) * e2
      );
      if (walkIn >= 1) {
        entering = false;
        if (reverse) {
          mode = 'street';
          reverse = false;
          fovTarget = STREET_FOV;
          sph.theta = goal.theta = -0.13; sph.phi = goal.phi = 1.60;
          sph.r = goal.r = R_IDEAL; tgt.set(0, 4.7, 0);
          autoSpin = true; idle = 0; sway = 0;
          document.getElementById('mark').classList.add('in');
          document.getElementById('hint').textContent =
            'Drag to look around \u00b7 Tap the door to enter';
          document.getElementById('hint').classList.add('in');
        } else {
          mode = 'inside';
          advance = 0.12;
          fovTarget = fovFor('inside');
          sph.theta = goal.theta = 0; sph.phi = goal.phi = 1.57;
          if (backEl) backEl.classList.add('shown');
          var hn = document.getElementById('hint');
          hn.textContent = 'Look around \u00b7 Tap a piece to view it';
          hn.classList.add('in');
        }
      }
      renderStars(dt);
      renderer.render(scene, camera);
      return;
    }
    if (mode === 'inside') {
      if (Math.abs(camera.fov - fovTarget) > 0.04) {
        camera.fov += (fovTarget - camera.fov) * 0.09;
        camera.updateProjectionMatrix();
      }
      sph.theta += (goal.theta - sph.theta) * 0.09;
      sph.phi += (goal.phi - sph.phi) * 0.09;
      place();
      for (var pi = 0; pi < products.length; pi++) {
        var pm = products[pi].userData.mesh;
        if (!pm) continue;
        var want = pm.userData.lift ? 0.09 : 0;
        pm.position.y += (pm.userData.baseY + want - pm.position.y) * 0.16;
      }
      renderStars(dt);
      renderer.render(scene, camera);
      return;
    }
    if (false) {
      idle += dt;
      if (idle > 3.4 && !autoSpin) {
        autoSpin = true;
        sway = Math.asin(Math.max(-1, Math.min(1, goal.theta / 0.15)));
      }
      if (autoSpin) {
        sway += dt * 0.085;
        goal.theta = Math.sin(sway) * 0.15;
        goal.phi += (1.58 - goal.phi) * 0.005;
      }
    }

    if (Math.abs(camera.fov - fovTarget) > 0.04) {
      camera.fov += (fovTarget - camera.fov) * 0.09;
      camera.updateProjectionMatrix();
    }
    sph.r += (goal.r - sph.r) * 0.06;
    sph.theta += (goal.theta - sph.theta) * 0.08;
    sph.phi += (goal.phi - sph.phi) * 0.08;
    place();

    if (!entering) {
      ray.setFromCamera(pointer, camera);
      if (mode === 'street') {
        var over = ray.intersectObject(hit).length > 0;
        if (over !== hot) { hot = over; el.style.cursor = hot ? 'pointer' : 'grab'; }
      } else {
        var pk = ray.intersectObjects(products);
        var t2 = pk.length ? pk[0].object : null;
        if (t2 !== hotProduct) {
          if (hotProduct) setLift(hotProduct, false);
          hotProduct = t2;
          if (hotProduct) setLift(hotProduct, true);
          el.style.cursor = hotProduct ? 'pointer' : 'grab';
          if (tagEl) {
            if (hotProduct && !touchOnly) {
              tagEl.textContent = hotProduct.userData.name;
              tagEl.classList.add('shown');
            } else tagEl.classList.remove('shown');
          }
        }
      }
    }

    var breathe = touchOnly ? 0.17 + Math.sin(clock.elapsedTime * 1.5) * 0.08 : 0;
    var want = entering ? 0 : (hot ? 0.55 : breathe);
    halo.material.opacity += (want - halo.material.opacity) * 0.1;
    doorGlassMat.emissiveIntensity = 1.25 + (hot ? 0.7 : breathe * 1.2) +
      Math.sin(clock.elapsedTime * 0.8) * 0.05;

    renderStars(dt);
    renderer.render(scene, camera);
  }

  place();
  frame();

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    R_IDEAL = idealRadius();
    R_MIN = Math.max(14, R_IDEAL * 0.42);
    R_MAX = R_IDEAL * 1.5;
    fovTarget = fovFor(mode);
    if (entering) return;
    if (userZoomed) goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r));
    else goal.r = R_IDEAL;
  });

  setTimeout(function () {
    document.getElementById('veil').classList.add('gone');
    document.getElementById('mark').classList.add('in');
  }, 900);
  setTimeout(function () { document.getElementById('hint').classList.add('in'); }, 2600);
})();
</script>
