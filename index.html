<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #13100B; }
  body {
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    color: #F2EDE4;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .veil {
    position: fixed; inset: 0; z-index: 40;
    background: #13100B;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease;
  }
  .veil.gone { opacity: 0; pointer-events: none; }
  .veil p {
    font-size: 13px; letter-spacing: 0.42em; text-indent: 0.42em;
    color: rgba(240,226,196,0.5);
  }

  .mark {
    position: fixed; top: 26px; left: 0; right: 0; z-index: 20;
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.6s ease 0.5s;
  }
  .mark.in { opacity: 1; }
  .mark span {
    display: block; font-size: 17px; font-weight: 400;
    letter-spacing: 0.36em; text-indent: 0.36em;
    color: rgba(246,235,212,0.92);
  }
  .mark small {
    display: block; margin-top: 7px; font-size: 9px;
    letter-spacing: 0.46em; text-indent: 0.46em;
    color: rgba(240,226,196,0.4);
    font-family: system-ui, sans-serif;
  }

  .hint {
    position: fixed; bottom: 34px; left: 0; right: 0; z-index: 20;
    text-align: center; pointer-events: none;
    font-size: 11px; letter-spacing: 0.3em; text-indent: 0.3em;
    color: rgba(240,226,196,0.42);
    font-family: system-ui, sans-serif;
    opacity: 0; transition: opacity 1.4s ease;
  }
  .hint.in { opacity: 1; }

  .prompt {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,7,6,0.72);
    opacity: 0; pointer-events: none;
    transition: opacity 0.55s ease;
  }
  .prompt.open { opacity: 1; pointer-events: auto; }
  .card {
    width: min(88vw, 420px);
    padding: 44px 34px 34px;
    text-align: center;
    border: 1px solid rgba(201,162,39,0.42);
    background: rgba(10,9,8,0.92);
    transform: translateY(14px);
    transition: transform 0.55s cubic-bezier(0.2,0.8,0.25,1);
  }
  .prompt.open .card { transform: translateY(0); }
  .card h2 {
    font-size: 27px; font-weight: 300;
    letter-spacing: 0.14em; text-indent: 0.14em;
    margin-bottom: 14px;
  }
  .card p {
    font-size: 12px; line-height: 1.9; letter-spacing: 0.16em;
    color: rgba(242,237,228,0.5);
    font-family: system-ui, sans-serif;
    margin-bottom: 32px;
  }
  .card button {
    display: block; width: 100%; padding: 15px;
    font-family: system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.28em; text-indent: 0.28em;
    cursor: pointer; border-radius: 0; transition: all 0.35s ease;
  }
  .go {
    color: #0a0908; background: #C9A227;
    border: 1px solid #C9A227; margin-bottom: 12px;
  }
  .go:hover { background: #DDB93C; border-color: #DDB93C; }
  .no {
    color: rgba(242,237,228,0.5); background: transparent;
    border: 1px solid rgba(242,237,228,0.18);
  }
  .no:hover { color: #F2EDE4; border-color: rgba(242,237,228,0.4); }
  button:focus-visible { outline: 2px solid #C9A227; outline-offset: 3px; }

  .fade {
    position: fixed; inset: 0; z-index: 35; background: #13100B;
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
  }
  .fade.on { opacity: 1; }
  .inside {
    position: fixed; inset: 0; z-index: 36;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; text-align: center; padding: 30px;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease 0.6s;
  }
  .inside.on { opacity: 1; }
  .inside h3 {
    font-size: 22px; font-weight: 300;
    letter-spacing: 0.2em; text-indent: 0.2em;
  }
  .inside p {
    font-size: 11px; letter-spacing: 0.22em; line-height: 2.2;
    color: rgba(242,237,228,0.42);
    font-family: system-ui, sans-serif;
    max-width: 320px;
  }
  .mute {
    position: fixed; z-index: 25;
    top: calc(22px + env(safe-area-inset-top)); right: 22px;
    width: 40px; height: 40px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(240,226,196,0.75);
    background: rgba(19,16,11,0.4);
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 50%;
    cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease, color 0.25s ease, border-color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mute.shown { opacity: 1; pointer-events: auto; }
  .mute:hover { color: #F6EBD4; border-color: rgba(201,162,39,0.7); }
  .mute svg { width: 17px; height: 17px; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>

<div id="stage"></div>

<div class="mark" id="mark">
  <span>ALFREDO GUERRERO</span>
  <small>GUADALAJARA</small>
</div>

<div class="hint" id="hint">Drag to look around &nbsp;·&nbsp; Tap the door to enter</div>

<div class="prompt" id="prompt" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="card">
    <h2 id="ptitle">Enter the boutique</h2>
    <p>Avenida Chapultepec, Guadalajara.<br>The doors are open.</p>
    <button class="go" id="go">Step inside</button>
    <button class="no" id="no">Stay on the street</button>
  </div>
</div>

<button class="mute" id="mute" aria-label="Mute music" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</button>

<div class="fade" id="fade"></div>
<div class="inside" id="inside">
  <h3>Inside</h3>
  <p>This is where the interior scene picks up — the racks, the hat wall, the counter. Next build.</p>
</div>

<div class="veil" id="veil"><p>GUADALAJARA</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  /* Old-money palette: warm limestone, black lacquer, brass, sodium light */
  var STONE = 0xC2A278, STONE_L = 0xD8BE96, STONE_D = 0x8C7047;
  var LACQUER = 0x14100B, BRASS = 0xC9A227, CREAM = 0xF2E6CE;
  var GLOW = 0xFFC978, SODIUM = 0xFFB863, FOLIAGE = 0x4E5033;
  var DUSK = 0x14100B;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(DUSK);
  scene.fog = new THREE.FogExp2(0x1A1309, 0.0108);

  var camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.96;
  document.getElementById('stage').appendChild(renderer.domElement);

  var world = new THREE.Group();
  scene.add(world);

  function mat(c, r, m) {
    return new THREE.MeshStandardMaterial({
      color: c, roughness: r === undefined ? 0.92 : r, metalness: m === undefined ? 0.02 : m
    });
  }
  function lit(c, s) {
    return new THREE.MeshStandardMaterial({
      color: c, emissive: c, emissiveIntensity: s, roughness: 0.85
    });
  }
  function box(w, h, d, m, x, y, z) {
    var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z);
    b.castShadow = true; b.receiveShadow = true;
    return b;
  }

  /* rusticated limestone — deep horizontal courses, offset joints */
  var rustic = (function () {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = '#C2A278';
    g.fillRect(0, 0, 256, 256);
    var rows = 4, rh = 64, seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var r = 0; r < rows; r++) {
      var off = (r % 2) * 64;
      for (var q = -1; q < 3; q++) {
        var x = q * 128 + off, y = r * rh;
        var v = 0.92 + rnd() * 0.16;
        g.fillStyle = 'rgba(' + Math.round(194 * v) + ',' + Math.round(162 * v) + ',' + Math.round(120 * v) + ',1)';
        g.fillRect(x + 3, y + 3, 122, rh - 6);
        g.fillStyle = 'rgba(255,236,201,0.20)';
        g.fillRect(x + 3, y + 3, 122, 3);
        g.fillStyle = 'rgba(58,40,20,0.32)';
        g.fillRect(x + 3, y + rh - 6, 122, 3);
      }
      g.fillStyle = 'rgba(58,40,20,0.38)';
      g.fillRect(0, y + rh - 3, 256, 3);
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding;
    return t;
  })();

  function stoneMat(scale) {
    var t = rustic.clone();
    t.needsUpdate = true;
    t.repeat.set(scale, scale);
    return new THREE.MeshStandardMaterial({ map: t, color: 0xFFFFFF, roughness: 0.94 });
  }

  /* ---------------- plinth + street ---------------- */
  var plinth = new THREE.Mesh(new THREE.CylinderGeometry(15, 15.5, 1.0, 80), mat(0x140F09, 0.96));
  plinth.position.y = -0.5;
  plinth.receiveShadow = true;
  world.add(plinth);

  var road = new THREE.Mesh(new THREE.CircleGeometry(15, 80), mat(0x1C150E, 0.98));
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.002;
  road.receiveShadow = true;
  world.add(road);

  world.add(box(34, 0.24, 3.6, mat(0x6B5738, 0.95), 0, 0.12, 3.2));
  world.add(box(34, 0.14, 0.34, mat(0x4A3B25, 0.94), 0, 0.19, 5.0));

  /* ---------------- boutique ---------------- */
  var shop = new THREE.Group();
  world.add(shop);

  var BW = 8.6, BH = 7.2, BD = 5.2;
  var FZ = 2.70, WALL_T = 0.35, BACK_Z = FZ - BD;

  shop.add(box(BW - 0.7, BH - 0.6, 0.25, lit(0xA8681F, 0.62), 0, 3.4, BACK_Z + 0.4));
  shop.add(box(BW - 0.7, 0.2, BD - 0.8, mat(0x35271A, 0.9), 0, 0.55, FZ - BD / 2));
  shop.add(box(BW - 0.7, 0.2, BD - 0.8, mat(0x1D1610, 0.9), 0, BH - 0.7, FZ - BD / 2));

  [[-2.4, 3.0], [2.4, 3.0], [0, 2.4]].forEach(function (p) {
    var l = new THREE.PointLight(GLOW, 2.6, 10, 2);
    l.position.set(p[0], p[1], FZ - 1.4);
    shop.add(l);
  });

  shop.add(box(WALL_T, BH, BD, mat(STONE_D, 0.93), -(BW / 2 - WALL_T / 2), BH / 2, FZ - BD / 2));
  shop.add(box(WALL_T, BH, BD, mat(STONE_D, 0.93), BW / 2 - WALL_T / 2, BH / 2, FZ - BD / 2));
  shop.add(box(BW, BH, WALL_T, mat(STONE_D, 0.93), 0, BH / 2, BACK_Z + WALL_T / 2));

  var WIN_Y0 = 0.95, WIN_Y1 = 3.95;
  var DOOR_W = 2.3, DOOR_BASE = 0.45, DOOR_STRAIGHT = 2.45;
  var DOOR_R = DOOR_W / 2;
  var DOOR_TOP = DOOR_BASE + DOOR_STRAIGHT + DOOR_R;
  var WIN_L0 = -3.62, WIN_L1 = -1.72, WIN_R0 = 1.72, WIN_R1 = 3.62;

  function rectHole(x0, y0, x1, y1) {
    var p = new THREE.Path();
    p.moveTo(x0, y0); p.lineTo(x0, y1); p.lineTo(x1, y1); p.lineTo(x1, y0); p.lineTo(x0, y0);
    return p;
  }
  function archPath(Ctor, w, base, straight) {
    var p = new Ctor(), r = w / 2;
    p.moveTo(-r, base);
    p.lineTo(-r, base + straight);
    p.absarc(0, base + straight, r, Math.PI, 0, true);
    p.lineTo(r, base);
    p.lineTo(-r, base);
    return p;
  }

  var facade = new THREE.Shape();
  facade.moveTo(-BW / 2, 0); facade.lineTo(BW / 2, 0);
  facade.lineTo(BW / 2, BH); facade.lineTo(-BW / 2, BH); facade.lineTo(-BW / 2, 0);
  facade.holes.push(rectHole(WIN_L0, WIN_Y0, WIN_L1, WIN_Y1));
  facade.holes.push(rectHole(WIN_R0, WIN_Y0, WIN_R1, WIN_Y1));
  facade.holes.push(archPath(THREE.Path, DOOR_W, DOOR_BASE, DOOR_STRAIGHT));

  var frontWall = new THREE.Mesh(
    new THREE.ExtrudeGeometry(facade, { depth: WALL_T, bevelEnabled: false, curveSegments: 32 }),
    stoneMat(0.22)
  );
  frontWall.position.set(0, 0, FZ - WALL_T);
  frontWall.castShadow = true; frontWall.receiveShadow = true;
  shop.add(frontWall);

  /* stone banding, cornices, quoins */
  shop.add(box(BW + 0.35, 0.55, BD + 0.35, mat(STONE_D, 0.92), 0, 0.27, FZ - BD / 2));
  shop.add(box(BW + 0.3, 0.34, BD + 0.3, mat(STONE_L, 0.9), 0, 4.62, FZ - BD / 2));
  shop.add(box(BW + 0.62, 0.5, BD + 0.62, mat(STONE_L, 0.88), 0, 7.0, FZ - BD / 2));
  shop.add(box(BW + 0.24, 0.26, BD + 0.24, mat(STONE_D, 0.9), 0, 6.7, FZ - BD / 2));

  [-(BW / 2 - 0.26), BW / 2 - 0.26].forEach(function (x) {
    for (var k = 0; k < 5; k++) {
      var wq = k % 2 === 0 ? 0.52 : 0.38;
      shop.add(box(wq, 0.8, 0.2, mat(k % 2 === 0 ? STONE_L : STONE, 0.9), x, 0.95 + k * 0.85, FZ + 0.1));
    }
  });

  /* carved keystone over the arch */
  var keystone = new THREE.Mesh(
    new THREE.CylinderGeometry(0.34, 0.5, 0.95, 4),
    mat(STONE_L, 0.88)
  );
  keystone.rotation.y = Math.PI / 4;
  keystone.position.set(0, DOOR_TOP + 0.18, FZ + 0.12);
  keystone.castShadow = true;
  shop.add(keystone);

  /* ---- black lacquer glazing ---- */
  var glassMat = new THREE.MeshStandardMaterial({
    color: 0xFFD79A, emissive: GLOW, emissiveIntensity: 0.42,
    roughness: 0.2, metalness: 0.08, transparent: true, opacity: 0.26, side: THREE.DoubleSide
  });
  [[WIN_L0, WIN_L1], [WIN_R0, WIN_R1]].forEach(function (w) {
    var pane = new THREE.Mesh(
      new THREE.PlaneGeometry(w[1] - w[0] - 0.02, WIN_Y1 - WIN_Y0 - 0.02), glassMat);
    pane.position.set((w[0] + w[1]) / 2, (WIN_Y0 + WIN_Y1) / 2, FZ - WALL_T / 2);
    shop.add(pane);
  });

  var doorGlass = new THREE.Mesh(
    new THREE.ShapeGeometry(archPath(THREE.Shape, DOOR_W - 0.06, DOOR_BASE + 0.03, DOOR_STRAIGHT - 0.03), 32),
    new THREE.MeshStandardMaterial({
      color: 0xFFDCA4, emissive: GLOW, emissiveIntensity: 1.15,
      roughness: 0.28, transparent: true, opacity: 0.58, side: THREE.DoubleSide
    })
  );
  doorGlass.position.set(0, 0, FZ - WALL_T / 2);
  shop.add(doorGlass);
  var doorGlassMat = doorGlass.material;

  var lacquer = mat(LACQUER, 0.32, 0.28);

  function surround(x0, y0, x1, y1, t) {
    var o = new THREE.Shape();
    o.moveTo(x0 - t, y0 - t); o.lineTo(x1 + t, y0 - t);
    o.lineTo(x1 + t, y1 + t); o.lineTo(x0 - t, y1 + t); o.lineTo(x0 - t, y0 - t);
    o.holes.push(rectHole(x0, y0, x1, y1));
    var m = new THREE.Mesh(new THREE.ExtrudeGeometry(o, { depth: 0.22, bevelEnabled: false }), lacquer);
    m.position.set(0, 0, FZ + 0.01);
    m.castShadow = true;
    shop.add(m);
    /* fine mullion grid */
    var cols = 2, rowsN = 3;
    for (var c = 1; c < cols; c++) {
      shop.add(box(0.05, y1 - y0, 0.05, lacquer, x0 + (x1 - x0) * c / cols, (y0 + y1) / 2, FZ + 0.08));
    }
    for (var r = 1; r < rowsN; r++) {
      shop.add(box(x1 - x0, 0.05, 0.05, lacquer, (x0 + x1) / 2, y0 + (y1 - y0) * r / rowsN, FZ + 0.08));
    }
  }
  surround(WIN_L0, WIN_Y0, WIN_L1, WIN_Y1, 0.2);
  surround(WIN_R0, WIN_Y0, WIN_R1, WIN_Y1, 0.2);

  var dOuter = archPath(THREE.Shape, DOOR_W + 0.5, DOOR_BASE - 0.25, DOOR_STRAIGHT + 0.25);
  dOuter.holes.push(archPath(THREE.Path, DOOR_W, DOOR_BASE, DOOR_STRAIGHT));
  var doorFrame = new THREE.Mesh(
    new THREE.ExtrudeGeometry(dOuter, { depth: 0.24, bevelEnabled: false, curveSegments: 32 }), lacquer);
  doorFrame.position.set(0, 0, FZ + 0.01);
  doorFrame.castShadow = true;
  shop.add(doorFrame);

  shop.add(box(0.07, DOOR_STRAIGHT + DOOR_R - 0.15, 0.07, lacquer,
    0, DOOR_BASE + (DOOR_STRAIGHT + DOOR_R - 0.15) / 2, FZ - WALL_T / 2 + 0.09));
  [-0.14, 0.14].forEach(function (hx) {
    shop.add(box(0.05, 0.62, 0.05, mat(BRASS, 0.28, 0.92), hx, 1.55, FZ + 0.17));
  });

  var stepPad = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.62, 0.14, 32, 1, false, 0, Math.PI), mat(0x5A4830, 0.94));
  stepPad.position.set(0, 0.14, FZ + 0.14);
  stepPad.rotation.y = Math.PI;
  stepPad.receiveShadow = true;
  shop.add(stepPad);

  shop.add(new THREE.PointLight(GLOW, 2.8, 10, 2).translateY(0));
  var doorSpill = new THREE.PointLight(GLOW, 2.8, 10, 2);
  doorSpill.position.set(0, 1.9, FZ + 0.9);
  shop.add(doorSpill);

  /* brass plaques flanking the entrance */
  function plaque(x) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 96;
    var g = c.getContext('2d');
    g.fillStyle = '#0E0B07'; g.fillRect(0, 0, 256, 96);
    g.strokeStyle = 'rgba(201,162,39,0.8)'; g.lineWidth = 3;
    g.strokeRect(8, 8, 240, 80);
    g.fillStyle = '#D9B865';
    g.font = '500 30px "Cormorant Garamond", Georgia, serif';
    g.textAlign = 'center';
    g.fillText('A · G', 128, 58);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    var p = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.31),
      new THREE.MeshStandardMaterial({ map: t, emissive: 0xFFFFFF, emissiveMap: t, emissiveIntensity: 0.5, roughness: 0.6 }));
    p.position.set(x, 1.85, FZ + 0.13);
    shop.add(p);
  }
  plaque(-1.62); plaque(1.62);

  /* wrought-iron balcony along the top */
  var iron = mat(0x0E0B07, 0.45, 0.55);
  shop.add(box(BW + 0.62, 0.12, 0.5, iron, 0, 7.3, FZ + 0.22));
  shop.add(box(BW + 0.62, 0.09, 0.5, iron, 0, 8.05, FZ + 0.22));
  for (var bi = 0; bi <= 26; bi++) {
    shop.add(box(0.06, 0.78, 0.06, iron, -(BW + 0.5) / 2 + bi * ((BW + 0.5) / 26), 7.68, FZ + 0.22));
  }

  /* busts inside the windows */
  function bust(x) {
    var b = new THREE.Group();
    b.position.set(x, 0.65, FZ - 1.25);
    var stand = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.66, 16), mat(0x241C13, 0.9));
    stand.position.y = 0.33; stand.castShadow = true; b.add(stand);
    var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.18, 0.6, 16), mat(0xE0D0B4, 0.7));
    torso.position.y = 0.96; torso.castShadow = true; b.add(torso);
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.175, 20, 16), mat(0xE0D0B4, 0.7));
    head.position.y = 1.38; b.add(head);
    var cap = new THREE.Mesh(
      new THREE.SphereGeometry(0.195, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(0x15120C, 0.75));

  function makeStars(count, size, rMin, rMax, elMin, elMax, tint, twLo, twHi) {
    var pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    var phase = new Float32Array(count), speed = new Float32Array(count), base = new Float32Array(count);
    var c = new THREE.Color(tint);
    for (var i = 0; i < count; i++) {
      var az = (Math.random() - 0.5) * Math.PI * 1.15;
      var elv = elMin + Math.random() * (elMax - elMin);
      var R = rMin + Math.random() * (rMax - rMin);
      pos[i * 3] = Math.sin(az) * Math.cos(elv) * R;
      pos[i * 3 + 1] = Math.sin(elv) * R;
      pos[i * 3 + 2] = -Math.abs(Math.cos(az) * Math.cos(elv)) * R;
      phase[i] = Math.random() * Math.PI * 2;
      speed[i] = twLo + Math.random() * (twHi - twLo);
      base[i] = 0.55 + Math.random() * 0.45;
      col[i * 3] = c.r * base[i]; col[i * 3 + 1] = c.g * base[i]; col[i * 3 + 2] = c.b * base[i];
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var pts = new THREE.Points(geo, new THREE.PointsMaterial({
      size: size, map: starSprite, vertexColors: true, transparent: true,
      opacity: 0.95, alphaTest: 0.02, blending: THREE.AdditiveBlending,
      sizeAttenuation: false, depthWrite: false, fog: false

    scene.add(pts);

      update: function (t) {
        if (reducedMotion) return;
        for (var j = 0; j < count; j++) {
          var sN = Math.sin(t * speed[j] + phase[j]);
          var k = base[j] * (0.3 + 0.7 * sN * sN);
          attr.array[j * 3] = c.r * k;
          attr.array[j * 3 + 1] = c.g * k;
          attr.array[j * 3 + 2] = c.b * k;

      }
    });

  /* Portrait phones have a far narrower horizontal field than a desktop
     screen, so a fixed distance crops in hard. Frame by world size instead. */
  function idealRadius() {
    var aspect = innerWidth / innerHeight;
    var tanV = Math.tan((camera.fov * Math.PI / 180) / 2);
    return Math.max(17 / (2 * tanV * aspect), 25 / (2 * tanV));
  }
  var R_IDEAL = idealRadius();
  var R_MIN = Math.max(14, R_IDEAL * 0.42);
  var R_MAX = R_IDEAL * 1.5;
  var R_START = R_IDEAL;
  var userZoomed = false, enterFrom = R_START;
  var tgt = new THREE.Vector3(0, 4.7, 0);
  var sph = { r: R_START, theta: -0.13, phi: 1.60 };
  var goal = { r: R_START, theta: -0.13, phi: 1.60 };
  var autoSpin = true, idle = 0, sway = 0;

  function place() {
    camera.position.set(
      tgt.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
      tgt.y + sph.r * Math.cos(sph.phi),
      tgt.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
    );
    camera.lookAt(tgt);
  }

  var dragging = false, moved = 0, lastX = 0, lastY = 0, pinch = 0;
  var el = renderer.domElement;
  var ray = new THREE.Raycaster();
  var pointer = new THREE.Vector2(999, 999);
  var hot = false, entering = false, walkIn = 0;

  var live = 0, multi = false, downX = 0, downY = 0, drift = 0;
  var touchOnly = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);

  function toNDC(e) {
    var r = el.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }
  function overDoor() {
    ray.setFromCamera(pointer, camera);
    return ray.intersectObject(hit).length > 0;
  }

  el.addEventListener('pointerdown', function (e) {
    live++;
    if (live > 1) { multi = true; dragging = false; return; }
    multi = false;
    dragging = true;
    downX = e.clientX; downY = e.clientY; drift = 0;
    lastX = e.clientX; lastY = e.clientY;
    toNDC(e);
    autoSpin = false; idle = 0;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });

  el.addEventListener('pointermove', function (e) {
    if (!touchOnly || dragging) toNDC(e);
    if (!dragging || multi) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    var d = Math.sqrt((e.clientX - downX) * (e.clientX - downX) +
                      (e.clientY - downY) * (e.clientY - downY));
    if (d > drift) drift = d;
    goal.theta = Math.min(TH_MAX, Math.max(TH_MIN, goal.theta - dx * 0.0050));
    goal.phi = Math.min(PH_MAX, Math.max(PH_MIN, goal.phi - dy * 0.0040));
  });

  function endPointer(e) {
    live = Math.max(0, live - 1);
    var wasDrag = dragging, wasMulti = multi;
    dragging = false;
    idle = 0;
    if (live === 0) multi = false;
    if (!wasDrag || wasMulti || entering) return;

    var isTouch = e.pointerType === 'touch' || e.pointerType === 'pen';
    var slop = isTouch ? 18 : 8;
    if (drift <= slop) {
      toNDC(e);
      if (overDoor()) { enterStore(); return; }
    }
    if (isTouch) { pointer.set(999, 999); hot = false; }
  }
  el.addEventListener('pointerup', endPointer);
  el.addEventListener('pointercancel', function () {
    live = Math.max(0, live - 1);
    dragging = false;
    if (live === 0) multi = false;
  });
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r + e.deltaY * 0.022));
    userZoomed = true; autoSpin = false; idle = 0;
  }, { passive: false });
  el.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  el.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinch) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
      goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r - (d - pinch) * 0.06));
      pinch = d; userZoomed = true; autoSpin = false; idle = 0;
    }
  }, { passive: true });
  el.addEventListener('touchend', function () { pinch = 0; });

  /* ---------------- enter ---------------- */
  function enterStore() {
    if (entering) return;
    entering = true;
    enterFrom = sph.r;
    startMusic();
    autoSpin = false;
    document.getElementById('mark').classList.remove('in');
    document.getElementById('hint').classList.remove('in');
    el.style.cursor = 'default';
    setTimeout(function () { document.getElementById('fade').classList.add('on'); }, 1000);
    setTimeout(function () { document.getElementById('inside').classList.add('on'); }, 2000);
  }

  /* ---------------- loop ---------------- */
  var clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);

    if (entering) {
      walkIn = Math.min(1, walkIn + dt * 0.4);
      var e2 = walkIn * walkIn * (3 - 2 * walkIn);
      goal.r = enterFrom + (7.0 - enterFrom) * e2;
      goal.theta *= (1 - e2 * 0.16);
      goal.phi += (1.62 - goal.phi) * 0.022;
      tgt.y = 4.7 + (2.3 - 4.7) * e2;
    } else {
      idle += dt;
      if (idle > 3.4 && !autoSpin) {
        autoSpin = true;
        sway = Math.asin(Math.max(-1, Math.min(1, goal.theta / 0.15)));
      }
      if (autoSpin) {
        sway += dt * 0.085;
        goal.theta = Math.sin(sway) * 0.15;
        goal.phi += (1.58 - goal.phi) * 0.005;
      }
    }

    sph.r += (goal.r - sph.r) * 0.06;
    sph.theta += (goal.theta - sph.theta) * 0.08;
    sph.phi += (goal.phi - sph.phi) * 0.08;
    place();

    if (!entering) {
      ray.setFromCamera(pointer, camera);
      var over = ray.intersectObject(hit).length > 0;
      if (over !== hot) {
        hot = over;
        el.style.cursor = hot ? 'pointer' : 'grab';
      }
    }

    var breathe = touchOnly ? 0.17 + Math.sin(clock.elapsedTime * 1.5) * 0.08 : 0;
    var want = entering ? 0 : (hot ? 0.55 : breathe);
    halo.material.opacity += (want - halo.material.opacity) * 0.1;
    doorGlassMat.emissiveIntensity = 1.25 + (hot ? 0.7 : breathe * 1.2) +
      Math.sin(clock.elapsedTime * 0.8) * 0.05;

    for (var s = 0; s < starLayers.length; s++) starLayers[s].update(clock.elapsedTime);

    renderer.render(scene, camera);
  }

  place();
  frame();

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    R_IDEAL = idealRadius();
    R_MIN = Math.max(14, R_IDEAL * 0.42);
    R_MAX = R_IDEAL * 1.5;
    if (entering) return;
    if (userZoomed) goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r));
    else goal.r = R_IDEAL;
  });

  setTimeout(function () {
    document.getElementById('veil').classList.add('gone');
    document.getElementById('mark').classList.add('in');
  }, 900);
  setTimeout(function () { document.getElementById('hint').classList.add('in'); }, 2600);
})();
</script>
